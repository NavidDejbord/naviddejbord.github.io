<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} — {% endif %}{{ site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script>
    window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']]}, options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']}};
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-brand" href="{{ '/' | relative_url }}">Navid Dejbord</a>
      <div class="site-links">
        <a href="{{ '/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.section == 'research' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/writings/' | relative_url }}"{% if page.section == 'writings' %} aria-current="page"{% endif %}>Writings &amp; Talks</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.section == 'cv' %} aria-current="page"{% endif %}>CV</a>
      </div>
    </nav>
  </header>
  <main id="main" class="page-content{% if page.section == 'about' %} home-content{% endif %}">
    {{ content }}
  </main>
  <footer class="site-footer">
    Navid Dejbord · <a href="https://github.com/NavidDejbord" rel="noopener noreferrer">GitHub</a>
  </footer>
</body>
</html>
