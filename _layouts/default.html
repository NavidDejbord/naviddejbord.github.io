<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfbf8">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} — {% endif %}{{ site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script>
    window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']]}, options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']}};
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="site-container">
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">Navid Dejbord<span class="site-dot">.</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.section == 'research' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/writings/' | relative_url }}"{% if page.section == 'writings' %} aria-current="page"{% endif %}>Writing &amp; Talks</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.section == 'cv' %} aria-current="page"{% endif %}>CV</a>
      </nav>
    </header>
    <main id="main" class="page-content {% if page.section == 'about' %}home-content{% endif %}">
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>Navid Dejbord</span>
      <span>Academic homepage · <a href="https://github.com/NavidDejbord" rel="noopener noreferrer">GitHub</a></span>
    </footer>
  </div>
</body>
</html>
