name: Import thesis PDFs

on:
  push:
    branches: [main]
    paths:
      - 'files/navid-academic-pdfs.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract and validate thesis PDFs
        shell: bash
        run: |
          set -euo pipefail
          archive="files/navid-academic-pdfs.zip"
          test -f "$archive"
          mkdir -p /tmp/thesis-pdfs
          unzip -oq "$archive" -d /tmp/thesis-pdfs
          for name in masters-thesis.pdf masters-thesis-summary.pdf bachelors-thesis.pdf bachelors-thesis-summary.pdf; do
            test -s "/tmp/thesis-pdfs/$name"
            cp "/tmp/thesis-pdfs/$name" "files/$name"
          done
          rm "$archive"
      - name: Commit extracted PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add files/masters-thesis.pdf files/masters-thesis-summary.pdf files/bachelors-thesis.pdf files/bachelors-thesis-summary.pdf files/navid-academic-pdfs.zip
          git commit -m "Add thesis PDFs to academic website"
          git push origin HEAD:main
